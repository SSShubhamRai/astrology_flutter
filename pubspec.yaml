name: astro_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  video_player: ^2.8.6
  google_fonts: ^6.2.1
  youtube_player_iframe: ^5.1.2
  # Firebase dependencies added here
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets configuration for local images and videos
  assets:
    - assets/images/
    - assets/videos/

  # Fonts configuration for your custom local font
  fonts:
    - family: Arseky
      fonts:
        - asset: assets/font/Arseky.otf